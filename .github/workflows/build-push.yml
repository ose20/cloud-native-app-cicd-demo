name: build-push

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions: {}

jobs:
  config-scan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: trivy
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Trivy from mise.toml
        uses: jdx/mise-action@v4
        with:
          cache_key_prefix: mise-${{ env.MISE_ENABLE_TOOLS }}

      - name: Scan Dockerfile configuration
        run: |
          trivy --quiet config --exit-code 0 --format json --output trivy-config-report.json Dockerfile
          trivy --quiet config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 Dockerfile

      - name: Upload Dockerfile scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-config-report
          path: trivy-config-report.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@v4

      - name: Run golangci-lint
        run: golangci-lint run --out-format github-actions ./...

  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@v4

      - name: Run tests and create reports
        run: |
          gotestsum --junitfile junit-report.xml -- -coverprofile=coverprofile.txt ./...
          gocover-cobertura < coverprofile.txt > coverprofile.xml
          go tool cover -func=coverprofile.txt

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            junit-report.xml
            coverprofile.txt
            coverprofile.xml
          if-no-files-found: warn

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs:
      - config-scan
      - lint
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go from mise.toml
        uses: jdx/mise-action@v4
        with:
          cache_key_prefix: mise-${{ env.MISE_ENABLE_TOOLS }}

      - name: Read Go version from mise
        id: go-version
        run: |
          version="$(mise exec -- go env GOVERSION)"
          echo "version=${version#go}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image as an archive
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}

      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-scan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: trivy
    steps:
      - name: Check out mise configuration
        uses: actions/checkout@v7

      - name: Download container image
        uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ${{ runner.temp }}

      - name: Set up Trivy from mise.toml
        uses: jdx/mise-action@v4
        with:
          cache_key_prefix: mise-${{ env.MISE_ENABLE_TOOLS }}

      - name: Scan container image
        run: |
          trivy --cache-dir "$RUNNER_TEMP/trivy-cache" image --scanners vuln --exit-code 0 --format json --output trivy-image-report.json --input "$RUNNER_TEMP/image.tar"
          trivy --cache-dir "$RUNNER_TEMP/trivy-cache" image --scanners vuln --exit-code 0 --no-progress --input "$RUNNER_TEMP/image.tar"
          trivy --cache-dir "$RUNNER_TEMP/trivy-cache" image --scanners vuln --exit-code 1 --severity CRITICAL --no-progress --input "$RUNNER_TEMP/image.tar"

      - name: Upload container image scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download scanned container image
        uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ${{ runner.temp }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned container image
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"

  tag-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      SOURCE_TAG: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push release images
        run: |
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${RELEASE_TAG}"
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${IMAGE_NAME}:latest"
