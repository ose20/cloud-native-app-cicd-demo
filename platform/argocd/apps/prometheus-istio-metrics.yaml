apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-istio-metrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ose20/cloud-native-app-cicd-demo.git
    targetRevision: main
    path: platform/monitoring/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
