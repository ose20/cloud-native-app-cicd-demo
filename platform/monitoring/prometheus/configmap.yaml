apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: istio-proxies
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - istio-system
                - progressive-delivery
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: keep
            regex: istio-proxy
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "15090"
          - source_labels:
              - __address__
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:15090
            target_label: __address__
          - action: replace
            target_label: __metrics_path__
            replacement: /stats/prometheus
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
