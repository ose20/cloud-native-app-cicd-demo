repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

environments:
  dev: {}
  prod: {}

---

releases:
  - name: prometheus
    namespace: monitoring
    atomic: true
    createNamespace: true
    timeout: 600
    chart: prometheus-community/prometheus
    version: "29.37.2"
    values:
      - values.yaml
      - environments/{{ .Environment.Name }}/values.yaml
