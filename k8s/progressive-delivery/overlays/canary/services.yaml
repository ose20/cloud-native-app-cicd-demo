apiVersion: v1
kind: Service
metadata:
  name: hello-world-stable
  namespace: progressive-delivery
spec:
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-canary
  namespace: progressive-delivery
spec:
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
