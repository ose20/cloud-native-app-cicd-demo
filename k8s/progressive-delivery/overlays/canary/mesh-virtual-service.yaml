apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-world-mesh
  namespace: progressive-delivery
spec:
  hosts:
    - hello-world-stable.progressive-delivery.svc.cluster.local
    - hello-world-canary.progressive-delivery.svc.cluster.local
  gateways:
    - mesh
  http:
    - name: internal
      route:
        - destination:
            host: hello-world-stable.progressive-delivery.svc.cluster.local
            port:
              number: 8080
          weight: 100
        - destination:
            host: hello-world-canary.progressive-delivery.svc.cluster.local
            port:
              number: 8080
          weight: 0
